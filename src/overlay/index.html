<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file:; img-src file:">
  <title>Water Tracker</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="app" data-state="hidden">
    <!-- she's drawn frame-by-frame from assets/her/*.webp (cut out of the videos in art/) -->
    <canvas id="her"></canvas>

    <div id="say"><span id="sayText"></span></div>

    <div id="fx">
      <span class="heart h1">♥</span><span class="heart h2">♥</span><span class="heart h3">♥</span><span class="heart h4">♥</span><span class="heart h5">♥</span>
      <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span><span class="spark s4">✦</span>
    </div>
    <div id="confetti"></div>

    <div id="card">
      <div id="count">0 of 8 today</div>
      <div id="cups"></div>
      <button id="drink" type="button">I drank it</button>
      <button id="snooze" type="button">Snooze 5 min</button>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
